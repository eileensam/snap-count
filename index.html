<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snap-Count</title>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;0,700;1,700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f6efd9;
            --paper-raised: #fbf6e9;
            --ink: #16130d;
            --ink-soft: #6b6350;
            --over: #a5382a;
            --under: #2c5a3b;
            --sg: #1e3a5c;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Bodoni Moda', Georgia, serif;
            margin: 0;
            padding: 1.2rem;
        }
        .wrap { max-width: 640px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 0.4rem; }
        .wordmark {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 1.9rem;
            margin: 0 0 0.3rem;
        }
        .week-tag {
            font-style: italic;
            font-size: 0.95rem;
            color: var(--ink-soft);
            margin: 0 0 0.4rem;
        }
        .page-nav { font-size: 0.78rem; margin: 0 0 1.6rem; }
        .page-nav .nav-item {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: var(--ink-soft);
            text-decoration: underline;
            cursor: pointer;
        }
        .page-nav .nav-item.current { color: var(--ink); font-weight: 700; text-decoration: none; }

        .tab-panel { margin-top: 1.6rem; margin-bottom: 2rem; border-top: 1.5px solid var(--ink); padding-top: 0.2rem; }
        .tab-panel[hidden] { display: none; }
        .graph { margin-bottom: 1.4rem; }
        .graph svg { display: block; width: 100%; height: auto; }
        .graph-dot-hit { cursor: pointer; }
        #graph-tooltip { pointer-events: none; }

        /* games this week */
        .games { margin: 0; }
        .game-row { padding: 0.6rem 0.1rem; border-bottom: 1px solid #ddd0ab; }
        .game-meta {
            display: flex;
            justify-content: space-between;
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 0.4rem;
        }
        .game-stake { color: var(--ink); font-weight: 600; }
        .game-teams {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .game-badge {
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 50%;
            border: 1.5px solid var(--team, var(--ink));
            object-fit: cover;
            background: var(--paper-raised);
            flex-shrink: 0;
        }
        .game-badge-placeholder {
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 50%;
            border: 1.5px solid var(--team, var(--ink));
            background: var(--paper-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-size: 0.5rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .game-at { color: var(--ink-soft); font-style: italic; font-size: 0.78rem; font-weight: 400; }
        .game-score { font-variant-numeric: tabular-nums; }

        /* scorebug: live/final games */
        .scorebug {
            border: 1.5px solid var(--ink);
            border-radius: 4px;
            background: var(--paper-raised);
            padding: 0.55rem 0.7rem 0.6rem;
        }
        .scorebug-status {
            display: flex;
            justify-content: space-between;
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 0.5rem;
        }
        .scorebug-status.live { color: var(--under); }
        .scorebug-live-dot {
            display: inline-block;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 50%;
            background: var(--under);
            margin-right: 0.35rem;
        }
        .scorebug-team {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0;
            color: var(--ink-soft);
        }
        .scorebug-team + .scorebug-team { border-top: 1px solid #ddd0ab; }
        .scorebug-team.leading { color: var(--ink); }
        .scorebug-name { flex: 1; font-weight: 700; font-size: 0.95rem; }
        .scorebug-score {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 1.3rem;
            min-width: 1.7rem;
            text-align: right;
        }
        .games-section-title {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink);
            margin: 1.6rem 0 0.5rem;
        }
        .games-section-title:first-child { margin-top: 0; }
        .games-empty, .lb-empty {
            font-size: 0.85rem;
            color: var(--ink-soft);
            font-style: italic;
            text-align: center;
            padding: 1.4rem 0;
            margin: 0;
        }

        /* leaderboard */
        .leaderboard { margin: 0; }
        .lb-row {
            display: block;
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid #ddd0ab;
            padding: 0.55rem 0.1rem;
            font: inherit;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }
        .lb-row-main { display: flex; align-items: baseline; gap: 0.6rem; }
        .lb-rank {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--ink-soft);
            width: 1.4rem;
            flex-shrink: 0;
        }
        .lb-rank-gold { color: #a8791a; }
        .lb-rank-silver { color: #93927f; }
        .lb-rank-bronze { color: #8a5a2e; }
        .lb-name { flex: 1; font-weight: 700; font-size: 0.95rem; }
        .lb-star { color: var(--sg); font-size: 0.85rem; flex-shrink: 0; }
        .lb-points {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .lb-chevron {
            color: var(--ink-soft);
            font-size: 0.7rem;
            width: 0.9rem;
            flex-shrink: 0;
            text-align: center;
        }
        .lb-picks {
            display: none;
            flex-direction: column;
            gap: 0.45rem;
            margin: 0.6rem 0 0.1rem 2rem;
        }
        .lb-row.expanded .lb-picks { display: flex; }
        .lb-pick { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
        .lb-pick-linked { cursor: pointer; text-decoration: underline; text-decoration-color: #ddd0ab; text-underline-offset: 2px; }
        .lb-pick-name { flex: 1; }
        .lb-pick-status {
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            border-radius: 3px;
            padding: 0.1rem 0.35rem;
            flex-shrink: 0;
        }
        .lb-pick-status.win, .lb-pick-status.live.ahead { color: var(--under); background: #e3ead9; }
        .lb-pick-status.loss, .lb-pick-status.live.behind { color: var(--over); background: #f3e2dd; }
        .lb-pick-status.tie, .lb-pick-status.live.tied { color: var(--ink-soft); background: #ece5d0; }
        .lb-pick-status.upcoming { color: #8a6a1f; background: #f2e2b8; }
        .lb-pick-status.bye { color: #5c7079; background: #dfe3e6; }
        .lb-pick-status.live {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .lb-pick-status.live::before {
            content: '';
            width: 0.35rem;
            height: 0.35rem;
            border-radius: 50%;
            background: currentColor;
        }
        .lb-pick .game-badge, .lb-pick .game-badge-placeholder { width: 1.3rem; height: 1.3rem; font-size: 0.4rem; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="wordmark">Snap-Count</div>
        <p class="week-tag" id="week-tag">&hellip;</p>
        <p class="page-nav">
            <button class="nav-item current" id="tab-leaderboard" data-tab="panel-leaderboard">Leaderboard</button> &middot;
            <button class="nav-item" id="tab-games" data-tab="panel-games">Games</button> &middot;
            <a class="nav-item" href="rules.html">Rules</a> &middot;
            <a class="nav-item" href="stats.html">Stats</a>
        </p>
    </div>

    <div class="tab-panel" id="panel-leaderboard">
        <div class="graph" id="graph"></div>
        <div class="leaderboard" id="leaderboard">
            <p class="lb-empty">Loading&hellip;</p>
        </div>
    </div>

    <div class="tab-panel" id="panel-games" hidden>
        <div class="games" id="games">
            <p class="games-empty">Loading&hellip;</p>
        </div>
    </div>
</div>

<script>
    const LOGOS = {};
    ['ari', 'atl', 'bal', 'buf', 'car', 'chi', 'cin', 'cle', 'dal', 'den', 'det', 'gb', 'hou', 'ind',
     'jax', 'kc', 'lac', 'lar', 'lv', 'mia', 'min', 'ne', 'no', 'nyg', 'nyj', 'phi', 'pit', 'sea', 'sf', 'tb', 'ten', 'wsh']
        .forEach(abbr => { LOGOS[abbr] = 'assets/logos/' + abbr + '.png'; });

    const BORDER_COLORS = {
        ari: '#802030', atl: '#16130d', bal: '#907000', buf: '#d00000', car: '#0070b0',
        chi: '#001020', cin: '#f03000', cle: '#300000', dal: '#002050', den: '#f04010',
        det: '#0030a0', gb: '#16130d', hou: '#001030', ind: '#001070', jax: '#c08000',
        kc: '#c01020', lac: '#001070', lar: '#002060', lv: '#16130d', mia: '#007070',
        min: '#f0b000', ne: '#c00020', no: '#16130d', nyg: '#001070', nyj: '#006030',
        phi: '#006030', pit: '#f0b000', sea: '#003080', sf: '#c02020', tb: '#c01020',
        ten: '#4080d0', wsh: '#501010'
    };

    // Point stakes: regular season is always 1 win = 1 point (docs/pool-rules.md).
    // Postseason round scoring (3/3/5/5) isn't wired up yet, not needed until the
    // playoffs; see docs/roadmap.md for this as an open item.
    function stakeFor(seasonType) {
        return seasonType === 'Regular Season' ? '1 PT' : '—';
    }

    const TEAM_ABBR = {
        'Arizona': 'ari', 'Atlanta': 'atl', 'Baltimore': 'bal', 'Buffalo': 'buf', 'Carolina': 'car',
        'Chicago': 'chi', 'Cincinnati': 'cin', 'Cleveland': 'cle', 'Dallas': 'dal', 'Denver': 'den',
        'Detroit': 'det', 'Green Bay': 'gb', 'Houston': 'hou', 'Indianapolis': 'ind', 'Jacksonville': 'jax',
        'Kansas City': 'kc', 'Los Angeles (Chargers)': 'lac', 'Los Angeles (Rams)': 'lar', 'Las Vegas': 'lv',
        'Miami': 'mia', 'Minnesota': 'min', 'New England': 'ne', 'New Orleans': 'no',
        'New York (Giants)': 'nyg', 'New York (Jets)': 'nyj', 'Philadelphia': 'phi', 'Pittsburgh': 'pit',
        'Seattle': 'sea', 'San Francisco': 'sf', 'Tampa': 'tb', 'Tennessee': 'ten', 'Washington': 'wsh'
    };

    const TEAM_FULL_NAME = {
        ari: 'Arizona', atl: 'Atlanta', bal: 'Baltimore', buf: 'Buffalo', car: 'Carolina', chi: 'Chicago',
        cin: 'Cincinnati', cle: 'Cleveland', dal: 'Dallas', den: 'Denver', det: 'Detroit', gb: 'Green Bay',
        hou: 'Houston', ind: 'Indianapolis', jax: 'Jacksonville', kc: 'Kansas City', lac: 'LA Chargers',
        lar: 'LA Rams', lv: 'Las Vegas', mia: 'Miami', min: 'Minnesota', ne: 'New England', no: 'New Orleans',
        nyg: 'NY Giants', nyj: 'NY Jets', phi: 'Philadelphia', pit: 'Pittsburgh', sea: 'Seattle',
        sf: 'San Francisco', tb: 'Tampa Bay', ten: 'Tennessee', wsh: 'Washington'
    };

    function team(name, price) {
        return { name, abbr: TEAM_ABBR[name], price };
    }

    // 2026 season picks. Small Group is the more engaged subset called out in
    // docs/pool-rules.md; the leaderboard marks them but ranks everyone together.
    const SMALL_GROUP = new Set(['Erika', 'Chris R.', 'Emma', 'Eileen', 'Sean R.']);

    const POOL = [
        { player: 'Abby', teams: [team('Baltimore', 70), team('Green Bay', 50), team('New Orleans', 35), team('Pittsburgh', 40), team('San Francisco', 55)] },
        { player: 'Ben', teams: [team('Arizona', 10), team('Atlanta', 35), team('Cleveland', 25), team('Indianapolis', 35), team('Las Vegas', 25), team('Miami', 15), team('Minnesota', 40), team('Tennessee', 30), team('Washington', 35)] },
        { player: 'Chris R.', teams: [team('Baltimore', 70), team('Carolina', 35), team('Jacksonville', 50), team('New York (Giants)', 35), team('San Francisco', 55)] },
        { player: 'Chris V.', teams: [team('Arizona', 10), team('Denver', 50), team('Miami', 15), team('New England', 55), team('San Francisco', 55), team('Seattle', 60)] },
        { player: 'Dad', teams: [team('Baltimore', 70), team('Denver', 50), team('Detroit', 55), team('Miami', 15), team('Philadelphia', 60)] },
        { player: 'Eileen', teams: [team('Baltimore', 70), team('Buffalo', 65), team('Detroit', 55), team('Philadelphia', 60)] },
        { player: 'Emma', teams: [team('Atlanta', 35), team('Baltimore', 70), team('Cincinnati', 55), team('Detroit', 55), team('Washington', 35)] },
        { player: 'Eric', teams: [team('Arizona', 10), team('Carolina', 35), team('Cleveland', 25), team('Denver', 50), team('Indianapolis', 35), team('Las Vegas', 25), team('Miami', 15), team('New York (Jets)', 25), team('Tennessee', 30)] },
        { player: 'Erika', teams: [team('Buffalo', 65), team('Denver', 50), team('Detroit', 55), team('Los Angeles (Rams)', 80)] },
        { player: 'Jackson', teams: [team('Atlanta', 35), team('Buffalo', 65), team('Chicago', 50), team('Green Bay', 50), team('Miami', 15), team('New York (Giants)', 35)] },
        { player: 'Mom', teams: [team('Buffalo', 65), team('Green Bay', 50), team('Indianapolis', 35), team('Minnesota', 40), team('Seattle', 60)] },
        { player: 'Pete', teams: [team('Arizona', 10), team('Denver', 50), team('Houston', 55), team('Los Angeles (Rams)', 80), team('New England', 55)] },
        { player: 'Phyllis', teams: [team('Baltimore', 70), team('Dallas', 50), team('Houston', 55), team('Indianapolis', 35), team('Pittsburgh', 40)] },
        { player: 'Scott', teams: [team('Arizona', 10), team('Detroit', 55), team('Houston', 55), team('Los Angeles (Rams)', 80), team('Miami', 15), team('Washington', 35)] },
        { player: 'Sean B.', teams: [team('Buffalo', 65), team('Detroit', 55), team('Miami', 15), team('New England', 55), team('Seattle', 60)] },
        { player: 'Sean R.', teams: [team('Baltimore', 70), team('Buffalo', 65), team('Detroit', 55), team('Philadelphia', 60)] },
        { player: 'Stacy', teams: [team('Arizona', 10), team('Buffalo', 65), team('Cincinnati', 55), team('Green Bay', 50), team('Las Vegas', 25), team('Tampa', 40)] },
        { player: 'Stephen', teams: [team('Buffalo', 65), team('Chicago', 50), team('Dallas', 50), team('Jacksonville', 50), team('New Orleans', 35)] },
        { player: 'Tim', teams: [team('Arizona', 10), team('Buffalo', 65), team('Kansas City', 60), team('Miami', 15), team('Minnesota', 40), team('Philadelphia', 60)] },
        { player: 'Wes', teams: [team('Dallas', 50), team('Green Bay', 50), team('New England', 55), team('Pittsburgh', 40), team('San Francisco', 55)] }
    ];

    // Only finished games count toward points; live/upcoming games contribute
    // nothing yet (docs/pool-rules.md: 1 pt/win, 0.5 pt/tie, regular season only
    // for now, see the stakeFor comment above for postseason).
    function teamPointsFromGames(games) {
        const points = {};
        games.forEach(g => {
            if (g.state !== 'post') return;
            const awayScore = Number(g.away.score), homeScore = Number(g.home.score);
            if (awayScore === homeScore) {
                points[g.away.abbr] = (points[g.away.abbr] || 0) + 0.5;
                points[g.home.abbr] = (points[g.home.abbr] || 0) + 0.5;
            } else {
                const winner = awayScore > homeScore ? g.away.abbr : g.home.abbr;
                points[winner] = (points[winner] || 0) + 1;
            }
        });
        return points;
    }

    function mergePoints(...maps) {
        const out = {};
        maps.forEach(m => Object.entries(m).forEach(([abbr, pts]) => {
            out[abbr] = (out[abbr] || 0) + pts;
        }));
        return out;
    }

    function formatPoints(n) {
        return (Math.round(n * 2) / 2).toString().replace(/^0\./, '.');
    }

    function pickRow(t, gameByTeam) {
        const row = document.createElement('div');
        row.className = 'lb-pick';
        row.appendChild(badgeEl(t.abbr, t.name));
        const name = document.createElement('span');
        name.className = 'lb-pick-name';
        name.textContent = TEAM_FULL_NAME[t.abbr] || t.name;
        row.appendChild(name);

        const game = gameByTeam.get(t.abbr);
        if (game) {
            // Only bridge to the Games tab when this team actually has a
            // game this week (byes and already-past-week picks stay plain).
            row.classList.add('lb-pick-linked');
            row.setAttribute('role', 'button');
            row.setAttribute('tabindex', '0');
            const goToGame = () => {
                document.getElementById('tab-games').click();
                requestAnimationFrame(() => {
                    const target = document.querySelector('#games [data-teams~="' + t.abbr + '"]');
                    if (target) target.scrollIntoView({ block: 'start' });
                });
            };
            row.addEventListener('click', e => { e.stopPropagation(); goToGame(); });
            row.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); goToGame(); }
            });

            // Upcoming: kickoff day/time, nothing decided yet. Live: a
            // "Live" marker, not a W/L call, since the game isn't final.
            // Final: the actual W/L/T.
            if (game.state === 'pre') {
                const status = document.createElement('span');
                status.className = 'lb-pick-status upcoming';
                status.textContent = formatKickoff(game.date);
                row.appendChild(status);
            } else {
                const isHome = game.home.abbr === t.abbr;
                const own = Number(isHome ? game.home.score : game.away.score);
                const opp = Number(isHome ? game.away.score : game.home.score);
                const outcome = own > opp ? 'ahead' : own < opp ? 'behind' : 'tied';
                const status = document.createElement('span');
                if (game.state === 'in') {
                    status.className = 'lb-pick-status live ' + outcome;
                    status.textContent = 'Live';
                } else {
                    status.className = 'lb-pick-status ' + ({ ahead: 'win', behind: 'loss', tied: 'tie' })[outcome];
                    status.textContent = ({ ahead: 'W', behind: 'L', tied: 'T' })[outcome];
                }
                row.appendChild(status);
            }
        } else if (gameByTeam.size) {
            // We have this week's full schedule and this team isn't on it.
            const status = document.createElement('span');
            status.className = 'lb-pick-status bye';
            status.textContent = 'Bye';
            row.appendChild(status);
        }

        return row;
    }

    function leaderboardRow(entry, gameByTeam) {
        const row = document.createElement('div');
        row.className = 'lb-row' + (SMALL_GROUP.has(entry.player) ? ' small-group' : '');
        row.setAttribute('role', 'button');
        row.setAttribute('tabindex', '0');
        row.setAttribute('aria-expanded', 'false');

        const main = document.createElement('div');
        main.className = 'lb-row-main';

        const rank = document.createElement('span');
        rank.className = 'lb-rank';
        if (entry.rank === 1) rank.classList.add('lb-rank-gold');
        else if (entry.rank === 2) rank.classList.add('lb-rank-silver');
        else if (entry.rank === 3) rank.classList.add('lb-rank-bronze');
        rank.textContent = entry.rank;
        main.appendChild(rank);

        const name = document.createElement('span');
        name.className = 'lb-name';
        name.textContent = entry.player;
        main.appendChild(name);

        if (SMALL_GROUP.has(entry.player)) {
            const star = document.createElement('span');
            star.className = 'lb-star';
            star.textContent = '★';
            star.title = 'Small Group';
            star.style.color = SG_COLORS[entry.player];
            main.appendChild(star);
        }

        const points = document.createElement('span');
        points.className = 'lb-points';
        points.textContent = formatPoints(entry.points);
        main.appendChild(points);

        const chevron = document.createElement('span');
        chevron.className = 'lb-chevron';
        chevron.textContent = '▾';
        main.appendChild(chevron);

        row.appendChild(main);

        const picks = document.createElement('div');
        picks.className = 'lb-picks';
        entry.teams.forEach(t => picks.appendChild(pickRow(t, gameByTeam)));
        row.appendChild(picks);

        function toggle() {
            const expanded = row.classList.toggle('expanded');
            row.setAttribute('aria-expanded', String(expanded));
            chevron.textContent = expanded ? '▴' : '▾';
        }
        row.addEventListener('click', toggle);
        row.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });

        return row;
    }

    function renderLeaderboard(teamPoints, gamesThisWeek) {
        const lbEl = document.getElementById('leaderboard');
        const gameByTeam = new Map();
        (gamesThisWeek || []).forEach(g => {
            gameByTeam.set(g.away.abbr, g);
            gameByTeam.set(g.home.abbr, g);
        });
        const entries = POOL.map(p => ({
            player: p.player,
            teams: p.teams,
            points: p.teams.reduce((sum, t) => sum + (teamPoints[t.abbr] || 0), 0)
        }));
        entries.sort((a, b) => b.points - a.points || a.player.localeCompare(b.player));

        let rank = 0, prevPoints = null;
        entries.forEach(entry => {
            if (entry.points !== prevPoints) { rank += 1; prevPoints = entry.points; }
            entry.rank = rank;
        });

        const expandedPlayers = new Set(
            Array.from(lbEl.querySelectorAll('.lb-row.expanded .lb-name')).map(el => el.textContent)
        );

        lbEl.innerHTML = '';
        entries.forEach(entry => {
            const row = leaderboardRow(entry, gameByTeam);
            if (expandedPlayers.has(entry.player)) {
                row.classList.add('expanded');
                row.setAttribute('aria-expanded', 'true');
            }
            lbEl.appendChild(row);
        });
    }

    // One color per Small Group player, drawn from the design system's five
    // content colors (docs/design/system.md); everyone else is an unlabeled
    // faint ink-soft line for context, not read individually.
    const SG_COLORS = {
        'Chris R.': '#1e3a5c',
        'Eileen': '#a8791a',
        'Emma': '#a5382a',
        'Erika': '#2c5a3b',
        'Sean R.': '#5a3a72'
    };

    function cumulativeTeamPointsByWeek(weeksGamesArr) {
        const cum = [];
        let running = {};
        weeksGamesArr.forEach(gamesForWeek => {
            running = mergePoints(running, teamPointsFromGames(gamesForWeek));
            cum.push(running);
        });
        return cum;
    }

    function playerTrajectories(weeksGamesArr) {
        const cumTeamPointsByWeek = cumulativeTeamPointsByWeek(weeksGamesArr);
        return POOL.map(p => ({
            player: p.player,
            smallGroup: SMALL_GROUP.has(p.player),
            values: cumTeamPointsByWeek.map(teamPoints =>
                p.teams.reduce((sum, t) => sum + (teamPoints[t.abbr] || 0), 0)
            )
        }));
    }

    function renderGraph(weeksGamesArr) {
        const graphEl = document.getElementById('graph');
        const numWeeks = weeksGamesArr.length;
        if (numWeeks === 0) { graphEl.innerHTML = ''; return; }

        // Every trajectory starts from a shared Week 0 = 0, so lines always
        // have a real origin instead of floating from whatever Week 1 was.
        const trajectories = playerTrajectories(weeksGamesArr).map(t => ({
            player: t.player,
            smallGroup: t.smallGroup,
            values: [0, ...t.values]
        }));
        const numPoints = numWeeks + 1;
        const W = 640, H = 260;
        const padLeft = 32, padRight = 14, padTop = 14, padBottom = 34;
        const innerW = W - padLeft - padRight;
        const innerH = H - padTop - padBottom;
        const maxY = Math.max(1, ...trajectories.flatMap(t => t.values)) * 1.15;

        function x(pointIdx) {
            return padLeft + (pointIdx / (numPoints - 1)) * innerW;
        }
        function y(v) {
            return padTop + innerH - (v / maxY) * innerH;
        }

        function lineFor(t) {
            const isSG = t.smallGroup;
            const color = isSG ? SG_COLORS[t.player] : '#6b6350';
            const d = t.values.map((v, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(v)).join(' ');
            return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + (isSG ? 2 : 1.4) + '" opacity="' + (isSG ? 1 : 0.55) + '" stroke-linejoin="round" stroke-linecap="round"/>';
        }

        // Round point-value gridline step (0.5/1/2/5/10/...) landing on
        // roughly 4 ticks, so the axis reads in sensible increments rather
        // than whatever the raw data range happens to be.
        function niceStep(maxVal, targetTicks) {
            const rough = maxVal / targetTicks;
            const steps = [0.5, 1, 2, 5, 10, 20, 25, 50, 100];
            for (const s of steps) { if (rough <= s) return s; }
            return steps[steps.length - 1];
        }
        const step = niceStep(maxY, 4);
        const ticks = [];
        for (let i = 0; i * step <= maxY; i++) ticks.push(i * step);

        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative points by week, tap any point for detail">';
        ticks.forEach(v => {
            const ty = y(v);
            svg += '<line x1="' + padLeft + '" y1="' + ty + '" x2="' + (W - padRight) + '" y2="' + ty + '" stroke="#ddd0ab" stroke-width="1"/>';
            svg += '<text x="' + (padLeft - 6) + '" y="' + (ty + 3) + '" font-family="Oswald, Arial Narrow, sans-serif" font-size="9" fill="#6b6350" text-anchor="end">' + formatPoints(v) + '</text>';
        });
        {
            const yTitleX = 9, yTitleY = padTop + innerH / 2;
            svg += '<text x="' + yTitleX + '" y="' + yTitleY + '" font-family="\'Bodoni Moda\', Georgia, serif" font-size="9" font-weight="600" fill="#6b6350" text-anchor="middle" transform="rotate(-90 ' + yTitleX + ' ' + yTitleY + ')">Points</text>';
        }
        trajectories.filter(t => !t.smallGroup).forEach(t => { svg += lineFor(t); });
        const sgTrajectories = trajectories.filter(t => t.smallGroup);
        sgTrajectories.forEach(t => { svg += lineFor(t); });

        // Week 0 is a trivial tie (everyone at 0), so it gets one shared
        // anchor dot instead of looping every player into the same pixel.
        {
            const cx = x(0), cy = y(0);
            svg += '<circle cx="' + cx + '" cy="' + cy + '" r="2.5" fill="#16130d"/>';
            svg += '<circle class="graph-dot-hit" data-week="0" data-value="0" data-players="all" data-colors="#16130d" data-x="' + cx + '" data-y="' + cy + '" cx="' + cx + '" cy="' + cy + '" r="6" fill="transparent"/>';
        }

        // Group players tied at the same value in the same week onto one
        // dot + one hit-target, instead of one hit-target per player stacked
        // on top of each other (only the topmost used to respond to
        // hover/tap, so ties silently showed just one name). The tooltip
        // for a group lists everyone there. Small Group presence gets the
        // larger, fully-opaque dot; Full League-only ties get a smaller,
        // faint one.
        for (let i = 1; i <= numWeeks; i++) {
            const groups = new Map();
            trajectories.forEach(t => {
                const v = t.values[i];
                if (!groups.has(v)) groups.set(v, []);
                groups.get(v).push(t);
            });
            groups.forEach((members, v) => {
                const cx = x(i), cy = y(v);
                const sgMembers = members.filter(m => m.smallGroup);
                const dotColor = sgMembers.length ? SG_COLORS[sgMembers[0].player] : '#6b6350';
                const dotR = sgMembers.length ? 2.5 : 1.5;
                const dotOpacity = sgMembers.length ? 1 : 0.5;
                svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + dotR + '" fill="' + dotColor + '" opacity="' + dotOpacity + '"/>';

                const names = members.map(m => m.player).join('|');
                const colors = members.map(m => m.smallGroup ? SG_COLORS[m.player] : '#16130d').join('|');
                svg += '<circle class="graph-dot-hit" data-week="' + i + '" data-value="' + formatPoints(v) +
                    '" data-players="' + names + '" data-colors="' + colors +
                    '" data-x="' + cx + '" data-y="' + cy +
                    '" cx="' + cx + '" cy="' + cy + '" r="6" fill="transparent"/>';
            });
        }

        for (let w = 0; w <= numWeeks; w++) {
            svg += '<text x="' + x(w) + '" y="' + (H - padBottom + 10) + '" font-family="Oswald, Arial Narrow, sans-serif" font-size="9" fill="#6b6350" text-anchor="middle">' + w + '</text>';
        }
        svg += '<text x="' + (padLeft + innerW / 2) + '" y="' + (H - 6) + '" font-family="\'Bodoni Moda\', Georgia, serif" font-size="9" font-weight="600" fill="#6b6350" text-anchor="middle">Week</text>';

        svg += '<g id="graph-tooltip" visibility="hidden">' +
            '<rect id="graph-tooltip-bg" fill="var(--paper-raised)" stroke="var(--ink)" stroke-width="1" rx="3"></rect>' +
            '<g id="graph-tooltip-lines"></g>' +
            '</g>';
        svg += '</svg>';
        graphEl.innerHTML = svg;
        wireGraphTooltip(graphEl, W, H);
    }

    function wireGraphTooltip(graphEl, W, H) {
        const tooltip = graphEl.querySelector('#graph-tooltip');
        const tooltipBg = graphEl.querySelector('#graph-tooltip-bg');
        const tooltipLines = graphEl.querySelector('#graph-tooltip-lines');
        const SVG_NS = 'http://www.w3.org/2000/svg';
        const lineHeight = 13;
        let pinnedDot = null;

        function addLine(text, color, y) {
            const t = document.createElementNS(SVG_NS, 'text');
            t.setAttribute('font-family', 'Oswald, Arial Narrow, sans-serif');
            t.setAttribute('font-size', '11');
            t.setAttribute('font-weight', '600');
            t.setAttribute('fill', color);
            t.setAttribute('x', 0);
            t.setAttribute('y', y);
            t.textContent = text;
            tooltipLines.appendChild(t);
        }

        function show(dot) {
            const px = Number(dot.dataset.x), py = Number(dot.dataset.y);
            const players = dot.dataset.players.split('|');
            const colors = dot.dataset.colors.split('|');
            const value = dot.dataset.value;
            const unit = value === '1' ? ' pt' : ' pts';

            tooltipLines.innerHTML = '';
            if (dot.dataset.week === '0') {
                addLine(value + unit + ' · all', colors[0], 0);
            } else if (players.length === 1) {
                addLine(players[0] + ' · ' + value + unit, colors[0], 0);
            } else {
                addLine(value + unit, '#6b6350', 0);
                players.forEach((name, i) => addLine(name, colors[i], (i + 1) * lineHeight));
            }

            const bbox = tooltipLines.getBBox();
            const padX = 6, padY = 4, gap = 9;
            const boxW = bbox.width + padX * 2, boxH = bbox.height + padY * 2;
            const onLeft = px > W / 2;
            const boxX = onLeft ? px - gap - boxW : px + gap;
            const boxY = Math.min(Math.max(py - boxH / 2, 2), H - boxH - 2);
            tooltipBg.setAttribute('x', boxX);
            tooltipBg.setAttribute('y', boxY);
            tooltipBg.setAttribute('width', boxW);
            tooltipBg.setAttribute('height', boxH);
            tooltipLines.setAttribute('transform', 'translate(' + (boxX + padX - bbox.x) + ',' + (boxY + padY - bbox.y) + ')');
            tooltip.setAttribute('visibility', 'visible');
        }
        function hide() { tooltip.setAttribute('visibility', 'hidden'); pinnedDot = null; }

        graphEl.querySelectorAll('.graph-dot-hit').forEach(dot => {
            dot.addEventListener('pointerenter', () => { if (!pinnedDot) show(dot); });
            dot.addEventListener('pointerleave', () => { if (!pinnedDot) hide(); });
            dot.addEventListener('click', e => {
                e.stopPropagation();
                if (pinnedDot === dot) { hide(); return; }
                pinnedDot = dot;
                show(dot);
            });
        });
        graphEl.addEventListener('click', () => hide());
    }

    function badgeEl(abbr, teamName) {
        const color = BORDER_COLORS[abbr] || '#16130d';
        if (LOGOS[abbr]) {
            const img = document.createElement('img');
            img.className = 'game-badge';
            img.style.setProperty('--team', color);
            img.src = LOGOS[abbr];
            img.alt = teamName;
            return img;
        }
        const div = document.createElement('div');
        div.className = 'game-badge-placeholder';
        div.style.setProperty('--team', color);
        div.textContent = abbr.toUpperCase();
        return div;
    }

    function formatKickoff(iso) {
        const d = new Date(iso);
        const day = d.toLocaleDateString('en-US', { weekday: 'short' });
        const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return day + ' · ' + time;
    }

    function formatGameDay(iso) {
        const d = new Date(iso);
        const day = d.toLocaleDateString('en-US', { weekday: 'short' });
        const date = d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
        return day + ' · ' + date;
    }

    function scorebugTeamRow(teamInfo, leading) {
        const r = document.createElement('div');
        r.className = 'scorebug-team' + (leading ? ' leading' : '');
        r.appendChild(badgeEl(teamInfo.abbr, teamInfo.name));
        const name = document.createElement('span');
        name.className = 'scorebug-name';
        name.textContent = teamInfo.name;
        r.appendChild(name);
        const score = document.createElement('span');
        score.className = 'scorebug-score';
        score.textContent = teamInfo.score;
        r.appendChild(score);
        return r;
    }

    function gameRow(game, stake) {
        const row = document.createElement('div');
        row.className = 'game-row';
        row.dataset.teams = game.away.abbr + ' ' + game.home.abbr;

        if (game.state === 'pre') {
            const meta = document.createElement('div');
            meta.className = 'game-meta';
            const metaLeft = document.createElement('span');
            metaLeft.textContent = formatKickoff(game.date);
            const metaRight = document.createElement('span');
            metaRight.className = 'game-stake';
            metaRight.textContent = stake;
            meta.appendChild(metaLeft);
            meta.appendChild(metaRight);
            row.appendChild(meta);

            const teamsEl = document.createElement('div');
            teamsEl.className = 'game-teams';
            const awayName = document.createElement('span');
            awayName.textContent = game.away.name;
            const at = document.createElement('span');
            at.className = 'game-at';
            at.textContent = 'at';
            const homeName = document.createElement('span');
            homeName.textContent = game.home.name;

            teamsEl.appendChild(badgeEl(game.away.abbr, game.away.name));
            teamsEl.appendChild(awayName);
            teamsEl.appendChild(at);
            teamsEl.appendChild(homeName);
            teamsEl.appendChild(badgeEl(game.home.abbr, game.home.name));

            row.appendChild(teamsEl);
            return row;
        }

        const bug = document.createElement('div');
        bug.className = 'scorebug';

        const status = document.createElement('div');
        status.className = 'scorebug-status' + (game.state === 'in' ? ' live' : '');
        const statusLeft = document.createElement('span');
        if (game.state === 'in') {
            const dot = document.createElement('span');
            dot.className = 'scorebug-live-dot';
            statusLeft.appendChild(dot);
        }
        // "Final" itself is already said by the section heading above, so a
        // finished game's own status line just gives the date instead of
        // repeating it.
        const statusText = game.state === 'post' ? formatGameDay(game.date) : game.statusDetail;
        statusLeft.appendChild(document.createTextNode(statusText));
        const statusRight = document.createElement('span');
        statusRight.className = 'game-stake';
        statusRight.textContent = stake;
        status.appendChild(statusLeft);
        status.appendChild(statusRight);
        bug.appendChild(status);

        const awayScore = Number(game.away.score), homeScore = Number(game.home.score);
        bug.appendChild(scorebugTeamRow(game.away, awayScore >= homeScore));
        bug.appendChild(scorebugTeamRow(game.home, homeScore >= awayScore));

        row.appendChild(bug);
        return row;
    }

    async function fetchCurrentWeekInfo() {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return { week: data.week.number, seasonType: data.leagues[0].season.type.name };
    }

    async function fetchWeekGames(week) {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=' + week);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return data.events.map(event => {
            const comp = event.competitions[0];
            const home = comp.competitors.find(c => c.homeAway === 'home');
            const away = comp.competitors.find(c => c.homeAway === 'away');
            return {
                date: event.date,
                state: event.status.type.state,
                statusDetail: event.status.type.shortDetail,
                home: { name: home.team.shortDisplayName, abbr: home.team.abbreviation.toLowerCase(), score: home.score },
                away: { name: away.team.shortDisplayName, abbr: away.team.abbreviation.toLowerCase(), score: away.score }
            };
        });
    }

    function showGamesError() {
        const gamesEl = document.getElementById('games');
        gamesEl.innerHTML = '';
        const empty = document.createElement('p');
        empty.className = 'games-empty';
        empty.textContent = 'Games unavailable right now.';
        gamesEl.appendChild(empty);
    }

    function showLeaderboardError() {
        const lbEl = document.getElementById('leaderboard');
        lbEl.innerHTML = '';
        const empty = document.createElement('p');
        empty.className = 'lb-empty';
        empty.textContent = 'Leaderboard unavailable right now.';
        lbEl.appendChild(empty);
    }

    // Live/Final/Upcoming, in that order, each sorted "most to least recent":
    // live and upcoming by soonest kickoff first, final by most recently
    // played first. A section (Live especially, empty most of the week) is
    // skipped entirely rather than shown with nothing under it.
    function renderGames(games, stake) {
        const gamesEl = document.getElementById('games');
        gamesEl.innerHTML = '';
        if (!games.length) {
            const empty = document.createElement('p');
            empty.className = 'games-empty';
            empty.textContent = 'No games scheduled.';
            gamesEl.appendChild(empty);
            return;
        }

        const byDate = (a, b) => a.date.localeCompare(b.date);
        const sections = [
            ['Live', games.filter(g => g.state === 'in').sort(byDate)],
            ['Final', games.filter(g => g.state === 'post').sort((a, b) => byDate(b, a))],
            ['Upcoming', games.filter(g => g.state === 'pre').sort(byDate)]
        ];

        sections.forEach(([title, group]) => {
            if (!group.length) return;
            const heading = document.createElement('div');
            heading.className = 'games-section-title';
            heading.textContent = title;
            gamesEl.appendChild(heading);
            group.forEach(game => gamesEl.appendChild(gameRow(game, stake)));
        });
    }

    // Live games get polled every 30s so scores/status update without a reload;
    // polling stops once nothing is left in progress.
    const POLL_INTERVAL_MS = 30000;

    async function initGamedayView() {
        const weekTagEl = document.getElementById('week-tag');

        let week, seasonType;
        try {
            ({ week, seasonType } = await fetchCurrentWeekInfo());
            weekTagEl.textContent = seasonType === 'Regular Season' ? 'Week ' + week + ' · ' + seasonType : seasonType;
        } catch (err) {
            console.error('Failed to load current week info:', err);
            weekTagEl.textContent = '';
            showGamesError();
            showLeaderboardError();
            return;
        }

        let priorWeeksGames = [];
        if (seasonType === 'Regular Season' && week > 1) {
            try {
                priorWeeksGames = await Promise.all(
                    Array.from({ length: week - 1 }, (_, i) => fetchWeekGames(i + 1))
                );
            } catch (err) {
                console.error('Failed to load prior weeks\' results:', err);
            }
        }
        const basePoints = teamPointsFromGames(priorWeeksGames.flat());

        const stake = stakeFor(seasonType);

        async function refresh() {
            const games = await fetchWeekGames(week);
            renderGames(games, stake);
            renderLeaderboard(mergePoints(basePoints, teamPointsFromGames(games)), games);
            renderGraph(priorWeeksGames.concat([games]));
            return games;
        }

        let games;
        try {
            games = await refresh();
        } catch (err) {
            console.error('Failed to load this week\'s games:', err);
            showGamesError();
            renderLeaderboard(basePoints);
            renderGraph(priorWeeksGames);
            return;
        }

        function scheduleNextPoll() {
            const stillLive = games.some(g => g.state === 'in');
            if (!stillLive) return;
            setTimeout(async () => {
                try {
                    games = await refresh();
                } catch (err) {
                    console.error('Failed to refresh live games:', err);
                }
                scheduleNextPoll();
            }, POLL_INTERVAL_MS);
        }
        scheduleNextPoll();
    }

    function initTabs() {
        const tabs = document.querySelectorAll('.nav-item[data-tab]');
        function activate(tab) {
            tabs.forEach(t => {
                t.classList.toggle('current', t === tab);
                document.getElementById(t.getAttribute('data-tab')).hidden = t !== tab;
            });
        }
        tabs.forEach(tab => tab.addEventListener('click', () => activate(tab)));

        // Cross-page links (e.g. from rules.html) can open straight to a tab.
        const requested = new URLSearchParams(location.search).get('tab');
        const requestedTab = requested && document.getElementById('tab-' + requested);
        if (requestedTab) activate(requestedTab);
    }

    initTabs();
    initGamedayView();
</script>
